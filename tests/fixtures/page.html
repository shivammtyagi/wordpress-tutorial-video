<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mock Admin</title>
<style>
  body { margin: 0; font-family: -apple-system, Arial, sans-serif; }
  #bar { background: #1d2327; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 16px; }
  #menu { background: #23282d; color: #fff; width: 200px; height: 100vh; position: fixed; top: 48px; }
  #menu a { display: block; color: #eee; padding: 12px 16px; text-decoration: none; }
  #menu a:hover { background: #0073aa; }
  #content { margin-left: 220px; padding: 24px; }
  #panel { display: none; border: 1px solid #ccc; border-radius: 8px; padding: 24px; max-width: 480px; }
  #panel.show { display: block; }
  .toggle { padding: 10px 16px; background: #2271b1; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
  <div id="bar">Mock WordPress Admin</div>
  <nav id="menu">
    <a href="#" id="seo-menu">SEO</a>
    <a href="#" id="sitemaps-link">Sitemaps</a>
  </nav>
  <div id="content">
    <h1>Dashboard</h1>
    <div id="panel">
      <h2>Sitemap Settings</h2>
      <p>Enable XML sitemaps for your site.</p>
      <button class="toggle" id="enable-toggle">Enable Sitemap</button>
    </div>
    <!-- widgets for the select / paste / dblclick / rewrite / redaction scenarios -->
    <div id="widgets" style="margin-top:24px">
      <select id="priority"><option value="low">Low</option><option value="high">High</option></select>
      <input id="code-field" type="text" placeholder="Paste the Jane Smith code">
      <code id="shortcode">[demo_shortcode]</code>
      <p>Signed in as <a id="owner" href="https://example-garden.com/author/jane" title="Jane Smith's profile">Jane Smith</a>
         <img id="avatar" alt="Jane Smith" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="24" height="24"></p>
      <div id="account-chip"><div id="account-email">jane.smith@example-garden.com</div><div id="account-plan">Pro plan</div></div>
      <textarea id="notes">Jane Smith wrote this draft</textarea>
    </div>
  </div>
  <script>
    document.getElementById('sitemaps-link').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('panel').classList.add('show');
    });
    document.getElementById('code-field').addEventListener('input', (e) => { e.target.dataset.inputs = String(Number(e.target.dataset.inputs || 0) + 1); });
    document.getElementById('shortcode').addEventListener('dblclick', (e) => { e.target.dataset.dbl = '1'; });
    document.getElementById('enable-toggle').addEventListener('click', (e) => {
      e.target.textContent = 'Sitemap Enabled ✓';
      e.target.style.background = '#198754';
    });
  </script>
</body>
</html>
